[project]
name = "tsfc"
version = "0.1.0"
description = "Time series forecasting system — learned mixture of zero-shot foundation models"
requires-python = ">=3.11"
dependencies = [
    "datasets>=2.17.1",
    "numpy>=1.26.4",
    "setuptools>=60.0.0,<82.0.0",
    "torch>=2.4.1",
    "tyro>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pyright>=1.1.360",
]
chronos = [
    "chronos-forecasting>=2.1.0",
]
moirai = [
    "uni2ts @ git+https://github.com/SalesforceAIResearch/uni2ts.git",
]
timesfm = [
    "timesfm @ git+https://github.com/google-research/timesfm.git",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tsfc"]

[tool.hatch.metadata]
allow-direct-references = true

# ---------------------------------------------------------------------------
# Ruff — linting + formatting
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in default args
    "SIM108", # ternary operator
]

[tool.ruff.lint.isort]
known-first-party = ["tsfc"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
